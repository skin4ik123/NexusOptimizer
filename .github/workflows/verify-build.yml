name: Verify and build Nexus Optimizer
on:
  push:
    branches: [codex/nexusoptimizer-039-fixes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      NEXUS_MULTI: '1'
      NEXUS_VERIFY_SCREENSHOTS: artifacts/screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension failed' }
          wix extension add -g WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX Util extension failed' }
      - name: Build and install the virtual TWAIN test device
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/virtual-scanner/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Virtual scanner build failed' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/virtual-scanner/install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Virtual scanner installation failed' }
      - name: Build application, execute PDF and scanner tests, package installer
        shell: pwsh
        run: |
          & ./build_installer.ps1 2>&1 | Tee-Object -FilePath build-verification.log
          if ($LASTEXITCODE -ne 0) { throw 'Verification or packaging failed' }
          $log = Get-Content build-verification.log -Raw
          if ($log -match 'SKIP test_') { throw 'Scanner tests were skipped' }
      - name: Verify packaged scanner workers and installer payload
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem artifacts/NexusOptimizer-Setup-*.exe)
          if ($setup.Count -ne 1 -or $setup[0].Length -lt 1000000) { throw 'Missing installer payload' }
          foreach ($arch in 32, 64) {
            $path = "dist/NexusOptimizer/_internal/scan/NexusScan$arch.exe"
            $lines = & $path layout | Out-String
            if ($LASTEXITCODE -ne 0 -or $lines -notmatch '"layout","ok":true') { throw "Packaged worker $arch failed: $lines" }
          }
          $python = '.venv/Scripts/python.exe'
          & $python -c "import importlib.metadata as m; print({n:m.version(n) for n in ['pymupdf','pikepdf','pillow','pyinstaller']})"
          Get-FileHash $setup[0].FullName -Algorithm SHA256 | Format-List
      - name: Install, launch and remove the delivered application
        shell: pwsh
        run: |
          $setup = (Get-ChildItem artifacts/NexusOptimizer-Setup-*.exe).FullName
          $installed = Join-Path $env:RUNNER_TEMP 'nexus-optimizer-installed'
          $process = Start-Process $setup -ArgumentList @('/S','/nodesktop','/nomenu',"/dir=$installed") -PassThru -Wait
          if ($process.ExitCode -notin 0, 3010) { throw "Setup failed: $($process.ExitCode)" }
          if (-not (Test-Path "$installed/NexusOptimizer.exe")) { throw 'Installed executable missing' }
          foreach ($arch in 32, 64) {
            $lines = & "$installed/_internal/scan/NexusScan$arch.exe" layout | Out-String
            if ($LASTEXITCODE -ne 0 -or $lines -notmatch '"layout","ok":true') { throw "Installed worker $arch failed" }
          }
          $sessionRoot = Join-Path $env:RUNNER_TEMP 'nexus-installed-session'
          New-Item -ItemType Directory -Force -Path $sessionRoot | Out-Null
          $env:APPDATA = Join-Path $sessionRoot 'roaming'
          $env:LOCALAPPDATA = Join-Path $sessionRoot 'local'
          & .venv/Scripts/python.exe tests/test_lifecycle.py --scenario seed --root $sessionRoot
          if ($LASTEXITCODE -ne 0) { throw 'Installed scan-session fixture failed' }
          $exportHash = (Get-FileHash (Join-Path $sessionRoot 'exported.png')).Hash
          & .venv/Scripts/python.exe tests/test_packaged.py --exe "$installed/NexusOptimizer.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed PDF worker check failed' }
          $app = Start-Process "$installed/NexusOptimizer.exe" -PassThru
          try {
            for ($i = 0; $i -lt 100; $i++) {
              Start-Sleep -Milliseconds 200
              $app.Refresh()
              if ($app.HasExited) { throw "Installed app exited: $($app.ExitCode)" }
              if ($app.MainWindowTitle -like 'Nexus Optimizer*') { break }
            }
            if ($app.MainWindowTitle -notlike 'Nexus Optimizer*') { throw 'Installed main window did not open' }
            Write-Host "Installed app opened: $($app.MainWindowTitle)"
            Start-Sleep -Milliseconds 600
            & .venv/Scripts/python.exe -c "from PIL import ImageGrab; ImageGrab.grab().save('artifacts/screenshots/installed.png')"
            $null = $app.CloseMainWindow()
            if (-not $app.WaitForExit(15000)) { throw 'Installed app did not close normally' }
          } finally {
            if (-not $app.HasExited) { $app.Kill() }
          }
          $scanRoot = Join-Path $env:LOCALAPPDATA 'NexusOptimizer/ScanSession'
          if (@(Get-ChildItem $scanRoot -Directory -ErrorAction SilentlyContinue).Count) { throw 'Installed GUI left scan session after normal close' }
          if (Test-Path (Join-Path $env:APPDATA 'NexusOptimizer/history.json')) { throw 'Installed GUI left session history' }
          if ((Get-FileHash (Join-Path $sessionRoot 'exported.png')).Hash -ne $exportHash) { throw 'Installed GUI damaged external export' }
          Write-Host 'Installed scan-session cleanup and external export verified'
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase((Resolve-Path artifacts/NexusOptimizer.msi).Path, 0)
          $view = $database.OpenView("SELECT Value FROM Property WHERE Property = 'ProductCode'")
          $view.Execute()
          $product = $view.Fetch().StringData(1)
          $remove = Start-Process msiexec.exe -ArgumentList @('/x',$product,'/qn','/norestart') -PassThru -Wait
          if ($remove.ExitCode -notin 0, 3010) { throw "Uninstall failed: $($remove.ExitCode)" }
          if (Test-Path "$installed/NexusOptimizer.exe") { throw 'Executable remained after uninstall' }
          Write-Host 'Installer, installed GUI, both scanner workers and uninstall verified'
      - name: Upload the single installer
        uses: actions/upload-artifact@v4
        with:
          name: NexusOptimizer-Setup
          path: artifacts/NexusOptimizer-Setup-*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload verification log and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexusoptimizer-verification
          path: |
            build-verification.log
            artifacts/SHA256SUMS.txt
            artifacts/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: windows
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NexusOptimizer-Setup
          path: delivered
      - uses: actions/download-artifact@v4
        with:
          name: nexusoptimizer-verification
          path: verification
      - name: Publish the verified single installer
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/nexusoptimizer-039-fixes" --jq '.object.sha')
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            printf 'A newer commit is awaiting verification; this build will not be published.\n'
            exit 0
          fi
          cd delivered
          sha256sum --check ../verification/artifacts/SHA256SUMS.txt
          cd ..
          version=$(python -c 'import re; print(re.search(r"APP_VERSION\s*=\s*\"([0-9.]+)\"", open("NexusPDFOptimizer.py", encoding="utf-8").read())[1])')
          tag="v$version"
          export NEXUS_RELEASE_VERSION="$version"
          python -c 'from pathlib import Path; import os; version=os.environ.get("NEXUS_RELEASE_VERSION", "3.10.0"); text=Path("CHANGELOG-"+version+".md").read_text(); digest=Path("verification/artifacts/SHA256SUMS.txt").read_text().strip(); Path("release-notes.md").write_text(text+"\nSHA-256: `"+digest.split()[0]+"`\n")'
          gh release create "$tag" "delivered/NexusOptimizer-Setup-$version.exe" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nexus Optimizer $version" --notes-file release-notes.md --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
